<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Negozio Artigianale</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #ddd; padding-bottom: 15px; }
        h1 { margin: 0; color: #444; }
        .admin-link { text-decoration: none; background: #333; color: white; padding: 8px 15px; border-radius: 4px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .card h3 { margin: 10px 0 5px; }
        .price { color: #b12704; font-weight: bold; font-size: 18px; margin: 10px 0; }
        .desc { font-size: 14px; color: #666; }
    </style>
</head>
<body>

    <header>
        <h1>La mia Bigiotteria</h1>
        <a href="admin.html" class="admin-link">Area Admin</a>
    </header>

    <div class="grid" id="catalogo">
        <p>Caricamento prodotti in corso...</p>
    </div>

    <script>
        // Legge il file prodotti.json dal tuo repository
        fetch('prodotti.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(prodotti => {
                const contenitore = document.getElementById('catalogo');
                contenitore.innerHTML = '';
                
                if (prodotti.length === 0) {
                    contenitore.innerHTML = '<p>Nessun prodotto disponibile al momento.</p>';
                    return;
                }

                prodotti.forEach(p => {
                    contenitore.innerHTML += `
                        <div class="card">
                            <img src="${p.immagine}" alt="${p.titolo}">
                            <h3>${p.titolo}</h3>
                            <div class="price">€ ${p.prezzo.toFixed(2)}</div>
                            <div class="desc">${p.descrizione}</div>
                        </div>
                    `;
                });
            })
            .catch(error => {
                document.getElementById('catalogo').innerHTML = '<p>Errore nel caricamento dei prodotti.</p>';
                console.error(error);
            });
    </script>

</body>
</html>
